name: Scheduled Model Retrain

on:
  schedule:
    - cron:  '0 3 * * 0'     # every Sunday at 03:00 UTC
  workflow_dispatch:       # allows manual triggers

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data ingest & process
        run: |
          python -m src.ingest.download_default_clients
          python -m src.ingest.fetch_macro
          python -m src.ingest.process_data


      - name: Retrain models & log to MLflow
        run: python -m src.models.train

      - name: Commit updated model artifacts
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: scheduled retrain"
          file_pattern: src/models/artifacts/*.pkl