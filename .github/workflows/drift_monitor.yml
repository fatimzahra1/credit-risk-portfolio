name: Model Drift Monitoring

on:
  schedule:
    - cron: '0 4 * * *'   # every day at 04:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Ingest & process data
        run: |
          python -m src.ingest.download_default_clients
          python -m src.ingest.fetch_macro
          python -m src.ingest.process_data

      - name: Run drift monitor
        run: python -m src.monitor.drift_monitor
